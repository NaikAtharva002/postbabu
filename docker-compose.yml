services:
  # 1. PostgreSQL Database for Agency & Multi-Tenant Workspaces
  postgres:
    image: postgres:16-alpine
    container_name: postbabu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postbabu_secret_password
      POSTGRES_DB: postbabu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis for BullMQ Millisecond-Precision Scheduled Jobs
  redis:
    image: redis:7-alpine
    container_name: postbabu_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Next.js Web Application & Agency Dashboard
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postbabu_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postbabu_secret_password@postgres:5432/postbabu?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}

  # 4. BullMQ Dedicated Publishing Worker Node
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: postbabu_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postbabu_secret_password@postgres:5432/postbabu?schema=public"
      REDIS_URL: "redis://redis:6379"

volumes:
  pgdata:
  redisdata:
